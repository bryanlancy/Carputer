name: API Documentation Verification

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/src/routes/**'
      - 'backend/src/config/swagger.ts'
      - 'backend/scripts/verify-swagger-docs.ts'
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/src/routes/**'
      - 'backend/src/config/swagger.ts'
      - 'backend/scripts/verify-swagger-docs.ts'

jobs:
  verify-docs:
    name: Verify Swagger Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify Swagger documentation
        working-directory: ./backend
        run: npm run docs:verify

