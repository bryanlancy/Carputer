image boot.vfat {
    vfat {
        files = {
            "Image",
            "bcm2711-rpi-4-b.dtb",
            "bcm2711-rpi-400.dtb",
            "bcm2711-rpi-cm4.dtb",
            "bcm2711-rpi-cm4s.dtb",
            "config.txt",
            "cmdline.txt",
            "start4.elf",
            "fixup4.dat"
        }

        file overlays {
            image = "overlays"
        }
    }

    size = 128M
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
